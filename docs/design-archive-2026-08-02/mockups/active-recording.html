<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memora — 録音中</title><style>
:root{--canvas:#F7F7F6;--surface:#FFFFFF;--alt:#F1F1F0;--text:#16171A;--secondary:#6B6D70;--tertiary:#A0A2A5;--border:#E4E4E3;--separator:#EFEFEE;--accent:#5B6B7A;--danger:#A34B45;--danger-soft:#F6ECEB}*{box-sizing:border-box}body{margin:0;background:var(--alt);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}button{font:inherit;color:inherit}#screen{position:relative;overflow:hidden;width:393px;height:852px;margin:auto;background:var(--canvas);border:1px solid var(--border)}svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.status{height:54px;padding:0 21px;display:flex;align-items:center;justify-content:space-between}.time{font-size:17px;line-height:26px;font-weight:500}.signals{display:flex;gap:5px;align-items:center}.signals .cellular{width:17px;height:11px}.signals .wifi{width:16px;height:11px}.signals .battery{width:25px;height:12px}.header{position:absolute;top:59px;left:0;right:0;height:55px;padding:5px 13px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid var(--separator)}.header button{width:44px;height:44px;padding:11px;border:0;background:transparent}.header h1{margin:0;text-align:center;font-size:17px;line-height:26px;font-weight:300}.main{position:absolute;top:114px;bottom:34px;left:0;right:0;padding:34px 21px;text-align:center}.state{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--danger);font-size:13px;line-height:20px;font-weight:500}.dot{width:8px;height:8px;border-radius:999px;background:var(--danger)}.timer{margin:21px 0 34px;font-size:36px;line-height:41px;font-weight:200;font-variant-numeric:tabular-nums}.wave{height:89px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--accent)}.wave span{width:3px;border-radius:999px;background:currentColor}.wave span:nth-child(1){height:13px}.wave span:nth-child(2){height:34px}.wave span:nth-chi
