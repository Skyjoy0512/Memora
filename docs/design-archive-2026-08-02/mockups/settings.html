<!doctype html>
<!-- 設定は AI に質問する文脈が無いため、コンポーザーを置かず、一覧の下端をタブバー上端までとする -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memora — 設定</title><style>
:root{--canvas:#F7F7F6;--surface:#FFFFFF;--alt:#F1F1F0;--text:#16171A;--secondary:#6B6D70;--tertiary:#A0A2A5;--border:#E4E4E3;--separator:#EFEFEE;--accent:#5B6B7A;--accent-soft:#EEF0F2}*{box-sizing:border-box}body{margin:0;background:var(--alt);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}button{font:inherit;color:inherit}#screen{position:relative;overflow:hidden;width:393px;height:852px;margin:auto;background:var(--canvas);border:1px solid var(--border)}svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.status{position:absolute;top:0;left:0;right:0;height:54px;padding:0 21px;display:flex;align-items:center;justify-content:space-between;background:var(--canvas);z-index:4}.time{font-size:17px;line-height:26px;font-weight:500}.status-icons{display:flex;align-items:center;gap:5px}.status .cellular{width:17px;height:11px}.status .wifi{width:16px;height:11px}.status .battery{width:25px;height:12px}.header{position:absolute;top:59px;left:0;right:0;height:55px;padding:5px 21px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--separator)}.select{min-width:89px;min-height:44px;padding:8px 0;border:0;background:transparent;display:flex;align-items:center;gap:5px;font-size:20px;line-height:28px;font-weight:300}.select svg{width:17px;height:17px;color:var(--secondary)}.actions{display:flex;gap:5px}.icon{width:44px;height:44px;padding:11px;border:0;background:transparent}.content{position:absolute;top:114px;bottom:83px;left:0;right:0;overflow:hidden;padding:13px 13px 0}.card{min-height:159px;padding:13px;margin-bottom:8px;border:1px solid var(--border);border-radius:13px;background:var(--surface)}.card-top{display:flex;align-items:center;justify-content:space-between}.chip{padding:3px 8px;border:1px solid var(--accent);border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:15px;font-weight:500}.more{width:24px;height:24px;padding:0;border:0;background:transparent;color:var(--secondary)}.title{margin:8px 0 5px;font-size:17px;line-height:26px;font-weight:500}.desc{display:-webkit-box;overflow:hidden;margin:0;color:var(--secondary);font-size:13px;line-height:20px;-webkit-box-orient:vertical;-webkit-line-clamp:2}.meta{margin:8px 0 0;color:var(--tertiary);font-size:11px;line-height:15px;font-weight:400}.composer{position:absolute;z-index:3;left:13px;right:13px;bottom:83px;height:120px;padding:13px;border:1px solid var(--border);border-radius:21px;background:rgba(255,255,255,.72);backdrop-filter:blur(21px) saturate(1.4)}.composer::before{position:absolute;top:0;left:21px;right:21px;height:1px;background:rgba(255,255,255,.92);content:""}.placeholder{height:34px;padding:5px 8px;color:var(--tertiary);font-size:15px;line-height:24px}.composer-row{display:flex;align-items:center;gap:5px}.composer .icon{width:34px;height:34px;padding:5px}.model{height:34px;padding:5px 8px;border:1px solid var(--border);border-radius:999px;background:rgba(247,247,246,.72);display:flex;align-items:center;gap:5px;font-size:13px;line-height:20px}.model svg{width:17px;height:17px;color:var(--secondary)}.send{margin-left:auto;border-radius:999px;background:var(--accent);color:var(--surface)}.tabs{position:absolute;z-index:4;bottom:0;left:0;right:0;height:83px;padding:5px 13px 34px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;border-top:1px solid var(--border);background:var(--canvas)}.tab{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--secondary);font-size:11px;line-height:15px;font-weight:400}.tab svg{width:22px;height:22px}.tab.active{color:var(--accent)}.fab{width:55px;height:55px;margin-top:-21px;justify-self:center;align-self:start;padding:11px;border:5px solid var(--canvas);border-radius:999px;background:var(--accent);color:var(--surface)}.fab svg{width:23px;height:23px}.indicator{position:absolute;z-index:5;bottom:8px;left:127px;width:139px;height:5px;border-radius:999px;background:rgba(22,23,26,.30)}.content.settings-content{bottom:83px;overflow:hidden;padding-top:13px}.screen-title{margin:0;font-size:20px;line-height:28px;font-weight:300}.setting-group{margin-bottom:13px}.setting-group h2{margin:0 0 5px;color:var(--secondary);font-size:13px;line-height:20px;font-weight:400}.setting-list{border:1px solid var(--border);border-radius:13px;background:var(--surface);overflow:hidden}.setting-row{min-height:54px;padding:13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--separator);font-size:15px;line-height:24px;font-weight:400}.setting-row:last-child{border-bottom:0}.setting-value{margin-left:auto;color:var(--tertiary);font-size:13px;line-height:20px;font-weight:400}.setting-row svg{width:17px;height:17px;color:var(--tertiary)}
</style></head><body><main id="screen" aria-label="Memora 設定"><div class="status"><span class="time">9:41</span><div class="status-icons"><svg class="cellular" width="17" height="11" viewBox="0 0 17 11" aria-label="電波強度"><rect x="0" y="7" width="2.75" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="4.75" y="5" width="2.75" height="6" rx="1" fill="currentColor" stroke="none"/><rect x="9.5" y="2.5" width="2.75" height="8.5" rx="1" fill="currentColor" stroke="none"/><rect x="14.25" y="0" width="2.75" height="11" rx="1" fill="currentColor" stroke="none"/></svg><svg class="wifi" width="16" height="11" viewBox="0 0 16 11" aria-label="Wi-Fi接続"><path d="M1 4.5a10 10 0 0 1 14 0M3.5 7a6.5 6.5 0 0 1 9 0M6 9.25a3 3 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="10" r="1" fill="currentColor" stroke="none"/></svg><svg class="battery" width="25" height="12" viewBox="0 0 25 12" aria-label="バッテリー残量"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".4"/><rect x="23" y="3.5" width="2" height="5" rx="1" fill="currentColor" stroke="none" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor" stroke="none"/></svg></div></div><header class="header"><h1 class="screen-title">設定</h1><div class="actions"></div></header><section class="content settings-content" aria-label="設定一覧"><section class="setting-group"><h2>アカウント</h2><div class="setting-list"><div class="setting-row"><span>プラン</span><span class="setting-value">無料</span></div><div class="setting-row"><span>アカウント</span><span class="setting-value"></span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div></div></section><section class="setting-group"><h2>文字起こしと要約</h2><div class="setting-list"><div class="setting-row"><span>処理方式</span><span class="setting-value">この端末で処理</span></div><div class="setting-row"><span>言語</span><span class="setting-value">日本語</span></div><div class="setting-row"><span>AI プロバイダ</span><span class="setting-value">Auto</span></div></div></section><section class="setting-group"><h2>保存とデータ</h2><div class="setting-list"><div class="setting-row"><span>保存先</span><span class="setting-value">この端末</span></div><div class="setting-row"><span>使用容量</span><span class="setting-value">2.4 GB</span></div><div class="setting-row"><span>書き出し</span><span class="setting-value"></span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div></div></section><section class="setting-group"><h2>通知</h2><div class="setting-list"><div class="setting-row"><span>会議のリマインダー</span><span class="setting-value">オン</span></div><div class="setting-row"><span>要約の完了通知</span><span class="setting-value">オン</span></div></div></section><section class="setting-group"><h2>表示</h2><div class="setting-list"><div class="setting-row"><span>テーマ</span><span class="setting-value">システム</span></div><div class="setting-row"><span>文字サイズ</span><span class="setting-value">標準</span></div></div></section><section class="setting-group"><h2>アプリについて</h2><div class="setting-list"><div class="setting-row"><span>バージョン</span><span class="setting-value">1.0.0</span></div><div class="setting-row"><span>利用規約</span><span class="setting-value"></span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div></div></section></section><nav class="tabs" aria-label="ナビゲーション"><div class="tab"><svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>ホーム</div><div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8 12 3 3 5-6"/></svg>タスク</div><button class="fab" aria-label="作成メニューを開く"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><div class="tab"><svg viewBox="0 0 24 24"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></svg>AI</div><div class="tab active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.3 2.7a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.3 2.7h4.4l.3-2.7a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>設定</div></nav><div class="indicator" aria-hidden="true"></div></main></body></html>
