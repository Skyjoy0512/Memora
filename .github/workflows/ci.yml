name: Memora CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-data:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test shared data package
        run: swift test --package-path Packages/MemoraSharedData

  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-expo/package-lock.json

      - name: Install Expo dependencies
        working-directory: apps/mobile-expo
        run: npm ci

      - name: Type-check Expo app
        working-directory: apps/mobile-expo
        run: npm run typecheck

      - name: Export Expo web bundle
        working-directory: apps/mobile-expo
        run: npx expo export --platform web

  rn-ios-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-expo/package-lock.json

      - name: Install Expo dependencies
        working-directory: apps/mobile-expo
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile-expo/ios
        run: pod install

      - name: Build React Native iOS host
        working-directory: apps/mobile-expo
        run: npm run qa:ios:build

  bot-server-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot-server/package-lock.json

      - name: Install Bot Server dependencies
        working-directory: bot-server
        run: npm ci

      - name: Build Bot Server
        working-directory: bot-server
        run: npm run build
